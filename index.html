<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>工具機 AI 維修單助手</title>

<style>
:root {
  --bg: #0b0d12;
  --card: #151922;
  --card2: #1b202b;
  --border: #2a3140;
  --text: #e8eaed;
  --muted: #9aa3b2;
  --accent: #7aa2ff;
  --accent2: #5d83e6;
  --ok: #6bcf8e;
  --warn: #e6b84d;
  --err: #f07178;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
}

body {
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom);
}

header {
  position: sticky;
  top: 0;
  z-index: 20;

  padding:
    12px
    14px
    11px;

  background: rgba(21, 25, 34, .96);
  backdrop-filter: blur(12px);

  border-bottom: 1px solid var(--border);

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.title {
  font-size: 1rem;
  font-weight: 700;
}

.sub {
  font-size: .7rem;
  color: var(--muted);
  margin-top: 2px;
}

.badge {
  font-size: .72rem;
  padding: 5px 9px;
  border-radius: 999px;
  background: #222833;
  color: var(--muted);
  white-space: nowrap;
}

.badge.ok {
  color: var(--ok);
}

.badge.warn {
  color: var(--warn);
}

.badge.err {
  color: var(--err);
}

main {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 14px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 12px;
}

.card-title {
  font-size: .95rem;
  font-weight: 700;
  margin-bottom: 12px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.field {
  margin-bottom: 10px;
}

.field:last-child {
  margin-bottom: 0;
}

label {
  display: block;
  font-size: .76rem;
  color: var(--muted);
  margin-bottom: 5px;
}

input,
textarea,
select {
  width: 100%;

  border: 1px solid var(--border);
  border-radius: 10px;

  background: #1e2430;
  color: var(--text);

  padding: 11px 12px;

  font-family: inherit;
  font-size: 16px;

  outline: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--accent);
}

textarea {
  min-height: 120px;
  resize: vertical;
  line-height: 1.55;
}

.problem textarea {
  min-height: 135px;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;

  margin-bottom: 7px;
}

.section-name {
  font-size: .9rem;
  font-weight: 700;
}

.ai-btn {
  border: 1px solid #3a4d78;
  background: #1a2740;
  color: #9db8ff;

  border-radius: 8px;

  padding: 7px 9px;

  font-size: .72rem;
  font-weight: 600;

  white-space: nowrap;
}

.ai-btn:active {
  transform: scale(.97);
}

.ai-btn:disabled {
  opacity: .4;
}

.ai-box {
  display: none;

  margin-top: 9px;

  border: 1px solid #34425e;
  background: #111824;

  border-radius: 10px;

  padding: 11px;
}

.ai-box.show {
  display: block;
}

.ai-title {
  color: #9db8ff;
  font-size: .72rem;
  font-weight: 700;
  margin-bottom: 7px;
}

.ai-text {
  color: #dce2ed;
  font-size: .83rem;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}

.ai-actions {
  display: flex;
  gap: 7px;
  margin-top: 9px;
}

.ai-actions button {
  flex: 1;
  border-radius: 8px;
  padding: 8px;

  font-family: inherit;
  font-size: .75rem;
}

.use-btn {
  border: none;
  background: var(--accent);
  color: #0b0d12;
  font-weight: 700;
}

.retry-btn {
  border: 1px solid var(--border);
  background: #202632;
  color: var(--text);
}

.big-ai {
  width: 100%;

  border: 1px solid #42547e;
  background: #192642;
  color: #aec2ff;

  border-radius: 11px;

  padding: 12px;

  font-family: inherit;
  font-size: .88rem;
  font-weight: 700;

  margin-top: 5px;
}

.big-ai:disabled {
  opacity: .4;
}

.result {
  display: none;

  margin-top: 10px;

  background: #10151f;
  border: 1px solid var(--border);

  border-radius: 11px;
  padding: 12px;
}

.result.show {
  display: block;
}

.result-title {
  font-size: .8rem;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 8px;
}

.result-text {
  white-space: pre-wrap;
  font-size: .84rem;
  line-height: 1.6;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

button {
  cursor: pointer;
  font-family: inherit;
}

.action-btn {
  border: none;
  border-radius: 10px;
  padding: 12px;

  background: #252b36;
  color: var(--text);

  font-size: .86rem;
  font-weight: 600;
}

.action-btn.primary {
  background: var(--accent);
  color: #0b0d12;
}

.action-btn.danger {
  color: #ff9ca1;
}

.setup {
  background: #111722;
}

.setup p {
  color: var(--muted);
  font-size: .77rem;
  line-height: 1.5;
  margin-bottom: 10px;
}

#loadBtn {
  width: 100%;
  border: none;
  border-radius: 10px;

  background: var(--accent);
  color: #0b0d12;

  padding: 12px;

  font-size: .9rem;
  font-weight: 700;
}

#loadBtn:disabled {
  opacity: .45;
}

.progress {
  margin-top: 9px;

  min-height: 1.2em;

  color: var(--muted);

  font-size: .72rem;
  line-height: 1.45;
}

.bar {
  height: 5px;
  background: #222833;
  border-radius: 4px;
  overflow: hidden;
  margin-top: 7px;
}

.bar i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width .2s;
}

.debug {
  margin-top: 9px;

  color: #737e91;

  font-size: .67rem;
  line-height: 1.45;

  white-space: pre-wrap;
}

.footer {
  text-align: center;

  color: #697385;

  font-size: .67rem;

  padding:
    5px
    10px
    20px;
}

@media (max-width: 600px) {

  .grid {
    grid-template-columns: 1fr;
  }

  main {
    padding: 10px;
  }

  .card {
    padding: 13px;
  }

  .actions {
    grid-template-columns: 1fr;
  }

}

@media print {

  body {
    background: white;
    color: black;
  }

  header {
    position: static;
    background: white;
    color: black;
    border-bottom: 1px solid #ccc;
  }

  .setup,
  .ai-btn,
  .ai-box,
  .big-ai,
  .actions,
  .footer,
  .debug {
    display: none !important;
  }

  main {
    max-width: none;
  }

  .card {
    background: white;
    border: 1px solid #ccc;
    color: black;
    break-inside: avoid;
  }

  input,
  textarea {
    background: white;
    color: black;
    border: 1px solid #aaa;
  }

  label,
  .sub {
    color: #555;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <div class="title">🔧 工具機 AI 維修單</div>
    <div class="sub">維修人員手動填寫 · AI 僅提供輔助建議</div>
  </div>

  <div id="status" class="badge warn">
    未載入
  </div>
</header>


<main>

  <!-- =========================
       AI MODEL
  ========================== -->

  <section class="card setup">

    <div class="card-title">
      🤖 AI 模型
    </div>

    <p>
      AI 在瀏覽器本機執行。第一次使用需要下載模型。
      建議手機先使用 0.5B～1B 模型。
    </p>

    <select id="model">
      <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC" selected>
        Llama 3.2 1B Instruct（約 879 MB）
      </option>

      <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">
        Qwen2.5 0.5B Instruct
      </option>

      <option value="Qwen3-0.6B-q4f16_1-MLC">
        Qwen3 0.6B
      </option>

      <option value="Gemma-3-1b-it-q4f16_1-MLC">
        Gemma 3 1B
      </option>

      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">
        Qwen2.5 1.5B Instruct
      </option>

      <option value="Qwen3-1.7B-q4f16_1-MLC">
        Qwen3 1.7B
      </option>

      <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">
        Phi-3.5 Mini Instruct
      </option>

      <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">
        SmolLM2 360M
      </option>
    </select>

    <br><br>

    <button id="loadBtn">
      載入 AI 模型
    </button>

    <div class="bar">
      <i id="bar"></i>
    </div>

    <div id="progress" class="progress">
      等待載入。
    </div>

    <div id="debug" class="debug">
      WebGPU：檢查中…
    </div>

  </section>


  <!-- =========================
       BASIC INFO
  ========================== -->

  <section class="card">

    <div class="card-title">
      📋 基本資料
    </div>

    <div class="grid">

      <div class="field">
        <label>機台編號</label>
        <input
          id="machineId"
          placeholder="例如：MC-001"
        >
      </div>

      <div class="field">
        <label>機台名稱</label>
        <input
          id="machineName"
          placeholder="例如：立式加工中心"
        >
      </div>

      <div class="field">
        <label>維修人員</label>
        <input
          id="technician"
          placeholder="輸入姓名"
        >
      </div>

      <div class="field">
        <label>維修日期</label>
        <input
          id="date"
          type="datetime-local"
        >
      </div>

    </div>

  </section>


  <!-- =========================
       PROBLEM
  ========================== -->

  <section class="card problem">

    <div class="section-head">

      <div class="section-name">
        ① 問題及現象
      </div>

      <button
        class="ai-btn"
        data-field="problem"
      >
        ✨ AI 建議
      </button>

    </div>

    <label>
      請先依現場實際情況手動描述
    </label>

    <textarea
      id="problem"
      placeholder="例如：
X軸快速移動時出現異常聲音，低速移動時比較不明顯。"
    ></textarea>

    <div id="problemAI" class="ai-box">

      <div class="ai-title">
        ✨ AI 建議
      </div>

      <div class="ai-text"></div>

      <div class="ai-actions">

        <button class="use-btn">
          採用
        </button>

        <button class="retry-btn">
          重新產生
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       CHECK
  ========================== -->

  <section class="card">

    <div class="section-head">

      <div class="section-name">
        ② 檢查結果
      </div>

      <button
        class="ai-btn"
        data-field="check"
      >
        ✨ AI 輔助
      </button>

    </div>

    <label>
      實際檢查、量測或測試結果
    </label>

    <textarea
      id="check"
      placeholder="例如：
檢查X軸線性滑軌，發現潤滑油不足。
手動移動時有輕微阻力。"
    ></textarea>

    <div id="checkAI" class="ai-box">

      <div class="ai-title">
        ✨ AI 建議補充
      </div>

      <div class="ai-text"></div>

      <div class="ai-actions">

        <button class="use-btn">
          採用
        </button>

        <button class="retry-btn">
          重新產生
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       CAUSE
  ========================== -->

  <section class="card">

    <div class="section-head">

      <div class="section-name">
        ③ 原因
      </div>

      <button
        class="ai-btn"
        data-field="cause"
      >
        ✨ AI 建議
      </button>

    </div>

    <label>
      請填寫已確認或目前判斷的故障原因
    </label>

    <textarea
      id="cause"
      placeholder="例如：
X軸線性滑軌潤滑不足。"
    ></textarea>

    <div id="causeAI" class="ai-box">

      <div class="ai-title">
        ✨ AI 建議
      </div>

      <div class="ai-text"></div>

      <div class="ai-actions">

        <button class="use-btn">
          採用
        </button>

        <button class="retry-btn">
          重新產生
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       ACTION
  ========================== -->

  <section class="card">

    <div class="section-head">

      <div class="section-name">
        ④ 處置方法
      </div>

      <button
        class="ai-btn"
        data-field="action"
      >
        ✨ AI 整理
      </button>

    </div>

    <label>
      實際執行的維修、調整或更換內容
    </label>

    <textarea
      id="action"
      placeholder="例如：
清潔X軸滑軌並補充潤滑油，完成試運轉。"
    ></textarea>

    <div id="actionAI" class="ai-box">

      <div class="ai-title">
        ✨ AI 建議
      </div>

      <div class="ai-text"></div>

      <div class="ai-actions">

        <button class="use-btn">
          採用
        </button>

        <button class="retry-btn">
          重新產生
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       AI REVIEW
  ========================== -->

  <section class="card">

    <div class="card-title">
      🧠 AI 維修單輔助
    </div>

    <button
      id="reviewBtn"
      class="big-ai"
      disabled
    >
      🔍 AI 檢查維修單完整度
    </button>

    <div
      id="reviewResult"
      class="result"
    >

      <div class="result-title">
        AI 檢查結果
      </div>

      <div
        id="reviewText"
        class="result-text"
      ></div>

    </div>

    <br>

    <button
      id="summaryBtn"
      class="big-ai"
      disabled
    >
      ✨ AI 整理完整維修紀錄
    </button>

    <div
      id="summaryResult"
      class="result"
    >

      <div class="result-title">
        AI 整理結果
      </div>

      <div
        id="summaryText"
        class="result-text"
      ></div>

    </div>

  </section>


  <!-- =========================
       ACTIONS
  ========================== -->

  <section class="card">

    <div class="actions">

      <button
        id="printBtn"
        class="action-btn primary"
      >
        🖨️ 列印 / PDF
      </button>

      <button
        id="clearBtn"
        class="action-btn danger"
      >
        🗑️ 清空維修單
      </button>

    </div>

  </section>


  <div class="footer">
    本頁資料只存在目前瀏覽器頁面中，不建立維修歷史。
    <br>
    AI 建議需由維修人員確認後使用。
  </div>

</main>


<script type="module">

import {
  CreateMLCEngine,
  prebuiltAppConfig
} from "https://esm.run/@mlc-ai/web-llm";


/* =========================================================
   DOM
========================================================= */

const modelSel =
  document.getElementById("model");

const loadBtn =
  document.getElementById("loadBtn");

const status =
  document.getElementById("status");

const progress =
  document.getElementById("progress");

const bar =
  document.getElementById("bar");

const debug =
  document.getElementById("debug");

const reviewBtn =
  document.getElementById("reviewBtn");

const summaryBtn =
  document.getElementById("summaryBtn");


/* =========================================================
   ENGINE
========================================================= */

let engine = null;
let busy = false;


/* =========================================================
   DEFAULT DATE
========================================================= */

function setDefaultDate() {

  const el =
    document.getElementById("date");

  const now =
    new Date();

  const local =
    new Date(
      now.getTime()
      - now.getTimezoneOffset() * 60000
    )
      .toISOString()
      .slice(0, 16);

  el.value = local;
}

setDefaultDate();


/* =========================================================
   STATUS
========================================================= */

function setStatus(text, cls) {

  status.textContent = text;

  status.className =
    "badge" +
    (cls ? " " + cls : "");
}


/* =========================================================
   MODEL CHECK
========================================================= */

function checkModel(modelId) {

  return prebuiltAppConfig.model_list.find(
    x => x.model_id === modelId
  );
}


/* =========================================================
   LOAD MODEL
========================================================= */

async function loadModel() {

  if (!navigator.gpu) {

    setStatus(
      "無 WebGPU",
      "err"
    );

    progress.textContent =
      "此瀏覽器沒有 WebGPU，無法執行 WebLLM。";

    debug.textContent =
      "WebGPU：✗ 不支援";

    return;
  }


  const modelId =
    modelSel.value;

  const modelInfo =
    checkModel(modelId);


  if (!modelInfo) {

    setStatus(
      "模型不存在",
      "err"
    );

    progress.textContent =
      "目前 WebLLM 版本找不到此模型。";

    return;
  }


  loadBtn.disabled = true;
  modelSel.disabled = true;

  setStatus(
    "載入中…",
    "warn"
  );

  progress.textContent =
    "開始初始化模型…";

  bar.style.width =
    "0%";


  let lastTime =
    Date.now();


  const watchdog =
    setInterval(() => {

      const idle =
        (Date.now() - lastTime) / 1000;

      debug.textContent =
`模型：${modelId}
WebGPU：✓ 支援
最後進度：${idle.toFixed(1)} 秒前`;

      if (idle > 20 && !engine) {

        progress.textContent =
          "⚠️ 超過 20 秒沒有進度，可能正在下載或初始化。";

      }

    }, 1000);


  try {

    engine =
      await CreateMLCEngine(
        modelId,
        {

          initProgressCallback: r => {

            lastTime =
              Date.now();

            if (
              typeof r.progress === "number"
            ) {

              const percent =
                Math.round(
                  r.progress * 100
                );

              bar.style.width =
                percent + "%";
            }

            progress.textContent =
              r.text ||
              "模型載入中…";

            debug.textContent =
`模型：${modelId}
WebGPU：✓ 支援
進度：${
  typeof r.progress === "number"
    ? Math.round(r.progress * 100) + "%"
    : "未知"
}
${r.text || ""}`;

          }

        }
      );


    clearInterval(watchdog);

    bar.style.width =
      "100%";

    progress.textContent =
      "模型已就緒。";

    debug.textContent =
      "WebGPU：✓ 支援\n模型：✓ 已載入";

    setStatus(
      "AI 已就緒",
      "ok"
    );


    reviewBtn.disabled =
      false;

    summaryBtn.disabled =
      false;

    loadBtn.textContent =
      "已載入";


  } catch (err) {

    clearInterval(watchdog);

    console.error(err);

    engine =
      null;

    setStatus(
      "載入失敗",
      "err"
    );

    progress.textContent =
      "❌ 載入失敗：\n" +
      (err?.message || String(err));

    debug.textContent =
      "錯誤：\n" +
      (err?.stack || err);

    loadBtn.disabled =
      false;

    modelSel.disabled =
      false;

  }

}


/* =========================================================
   GET FORM DATA
========================================================= */

function getForm() {

  return {

    machineId:
      document.getElementById(
        "machineId"
      ).value.trim(),

    machineName:
      document.getElementById(
        "machineName"
      ).value.trim(),

    technician:
      document.getElementById(
        "technician"
      ).value.trim(),

    date:
      document.getElementById(
        "date"
      ).value,

    problem:
      document.getElementById(
        "problem"
      ).value.trim(),

    check:
      document.getElementById(
        "check"
      ).value.trim(),

    cause:
      document.getElementById(
        "cause"
      ).value.trim(),

    action:
      document.getElementById(
        "action"
      ).value.trim()

  };
}


/* =========================================================
   AI CALL
========================================================= */

async function askAI(
  system,
  user
) {

  if (!engine) {

    throw new Error(
      "請先載入 AI 模型。"
    );

  }


  const result =
    await engine.chat.completions.create({

      messages: [

        {
          role: "system",
          content: system
        },

        {
          role: "user",
          content: user
        }

      ],

      temperature: 0.3,

      max_tokens: 150

    });


  return (
    result
      .choices?.[0]
      ?.message
      ?.content
      ?.trim()
    || ""
  );
}


/* =========================================================
   FIELD PROMPTS
========================================================= */

function buildPrompt(
  field,
  data
) {

  const common =
`你是「工具機維修紀錄文字助手」。

你的任務是協助維修人員把現場手寫內容整理成清楚、專業、客觀的繁體中文維修紀錄。

重要規則：
1. 不可以捏造沒有提供的檢查結果。
2. 不可以把「可能、懷疑、推測」改成「已確認」。
3. 不可以自行宣稱零件損壞。
4. 不可以自行增加維修人員沒有做過的維修。
5. 如果資訊不足，請明確指出資訊不足。
6. 使用台灣工廠常見的繁體中文。
7. 儘量簡潔。
8. 只輸出建議內容，不要加多餘解釋。`;


  if (field === "problem") {

    return common +

`
請將「問題及現象」整理成適合工具機維修單的描述。

原始描述：
${data.problem}

如果內容太簡短，請不要自行編造，只能用目前提供的資訊改善文字。
`;

  }


  if (field === "check") {

    return common +

`
目前的問題及現象：
${data.problem || "未填寫"}

目前檢查結果：
${data.check}

請協助整理「檢查結果」。
如果目前資訊不足，請提出最多3個建議確認項目，而不是假設檢查已完成。
`;

  }


  if (field === "cause") {

    return common +

`
問題及現象：
${data.problem || "未填寫"}

檢查結果：
${data.check || "未填寫"}

目前填寫的原因：
${data.cause}

請協助把原因整理成專業維修紀錄。

如果檢查結果不足以支持這個原因，
請使用「疑似」、「可能」等字眼，
不要寫成已確認故障。
`;

  }


  if (field === "action") {

    return common +

`
問題及現象：
${data.problem || "未填寫"}

檢查結果：
${data.check || "未填寫"}

原因：
${data.cause || "未填寫"}

目前處置方法：
${data.action}

請將實際處置內容整理成正式維修紀錄。
不得增加未提供的維修工作。
`;

  }

}


/* =========================================================
   AI FIELD BUTTON
========================================================= */

async function fieldAI(
  field
) {

  if (busy)
    return;


  if (!engine) {

    alert(
      "請先載入 AI 模型。"
    );

    return;
  }


  const data =
    getForm();


  const input =
    data[field];


  if (!input) {

    alert(
      "請先手動填寫此欄位，再使用 AI 輔助。"
    );

    return;
  }


  busy = true;


  const box =
    document.getElementById(
      field + "AI"
    );

  const textEl =
    box.querySelector(
      ".ai-text"
    );


  box.classList.add("show");

  textEl.textContent =
    "AI 分析中…";


  try {

    const answer =
      await askAI(
        buildPrompt(
          field,
          data
        ),
        input
      );


    textEl.textContent =
      answer ||
      "AI 沒有產生建議。";


    box.dataset.value =
      answer;


  } catch (err) {

    textEl.textContent =
      "錯誤：" +
      (err.message || err);

  } finally {

    busy = false;

  }

}


/* =========================================================
   FIELD BUTTONS
========================================================= */

document
  .querySelectorAll(".ai-btn")
  .forEach(btn => {

    btn.addEventListener(
      "click",
      () => {

        fieldAI(
          btn.dataset.field
        );

      }
    );

  });


/* =========================================================
   USE AI RESULT
========================================================= */

document
  .querySelectorAll(".ai-box")
  .forEach(box => {

    const use =
      box.querySelector(
        ".use-btn"
      );

    const retry =
      box.querySelector(
        ".retry-btn"
      );


    use.addEventListener(
      "click",
      () => {

        const field =
          box.id.replace(
            "AI",
            ""
          );

        const value =
          box.dataset.value || "";


        if (value) {

          document.getElementById(
            field
          ).value = value;

          box.classList.remove(
            "show"
          );

        }

      }
    );


    retry.addEventListener(
      "click",
      () => {

        const field =
          box.id.replace(
            "AI",
            ""
          );

        fieldAI(field);

      }
    );

  });
